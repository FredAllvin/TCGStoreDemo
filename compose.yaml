# Local development database. Start with: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tcgshop
      POSTGRES_USER: tcgshop
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcgshop -d tcgshop"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
