<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="#{admin.nav.categories} + ' – Admin'">Kategorier</title>
</head>
<body>
<main>
    <h1 class="h4 mb-3" th:text="#{admin.nav.categories}">Kategorier</h1>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm p-3">
                <th:block th:each="root : ${rootCategories}">
                    <div class="d-flex align-items-center gap-2 py-2 border-bottom">
                        <form th:action="@{'/admin/categories/' + ${root.id}}" method="post"
                              class="d-flex align-items-center gap-2 flex-grow-1">
                            <input type="text" name="name" class="form-control form-control-sm fw-semibold"
                                   th:value="${root.name}" maxlength="120" style="max-width: 240px;">
                            <input type="text" name="nameEn" class="form-control form-control-sm"
                                   th:value="${root.nameEn}" maxlength="120" style="max-width: 200px;"
                                   th:placeholder="#{admin.categories.nameEn}">
                            <input type="number" name="sortOrder" class="form-control form-control-sm"
                                   th:value="${root.sortOrder}" style="width: 70px;" title="Sortering">
                            <button class="btn btn-sm btn-outline-secondary" type="submit"
                                    th:text="#{admin.save}">Spara</button>
                        </form>
                        <form th:action="@{'/admin/categories/' + ${root.id} + '/delete'}" method="post"
                              onsubmit="return confirm(this.dataset.msg)" th:data-msg="#{admin.confirmDelete}">
                            <button class="btn btn-sm btn-link text-danger" type="submit"
                                    th:text="#{admin.delete}">Ta bort</button>
                        </form>
                    </div>
                    <div class="d-flex align-items-center gap-2 py-2 border-bottom ps-4"
                         th:each="child : ${root.children}">
                        <span class="text-muted">↳</span>
                        <form th:action="@{'/admin/categories/' + ${child.id}}" method="post"
                              class="d-flex align-items-center gap-2 flex-grow-1">
                            <input type="text" name="name" class="form-control form-control-sm"
                                   th:value="${child.name}" maxlength="120" style="max-width: 220px;">
                            <input type="text" name="nameEn" class="form-control form-control-sm"
                                   th:value="${child.nameEn}" maxlength="120" style="max-width: 180px;"
                                   th:placeholder="#{admin.categories.nameEn}">
                            <input type="number" name="sortOrder" class="form-control form-control-sm"
                                   th:value="${child.sortOrder}" style="width: 70px;">
                            <button class="btn btn-sm btn-outline-secondary" type="submit"
                                    th:text="#{admin.save}">Spara</button>
                        </form>
                        <form th:action="@{'/admin/categories/' + ${child.id} + '/delete'}" method="post"
                              onsubmit="return confirm(this.dataset.msg)" th:data-msg="#{admin.confirmDelete}">
                            <button class="btn btn-sm btn-link text-danger" type="submit"
                                    th:text="#{admin.delete}">Ta bort</button>
                        </form>
                    </div>
                </th:block>
                <p class="text-muted small mt-2 mb-0" th:if="${rootCategories.isEmpty()}"
                   th:text="#{category.empty}">Inga kategorier.</p>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card border-0 shadow-sm p-3">
                <h2 class="h6 text-uppercase text-muted" th:text="#{admin.categories.add}">Lägg till kategori</h2>
                <form th:action="@{/admin/categories}" method="post" class="d-flex flex-column gap-2">
                    <input type="text" name="name" class="form-control" required maxlength="120"
                           th:placeholder="#{admin.products.name}">
                    <input type="text" name="nameEn" class="form-control" maxlength="120"
                           th:placeholder="#{admin.categories.nameEn}">
                    <select name="parentId" class="form-select">
                        <option value="" th:text="#{admin.categories.topLevel}">— Toppnivå —</option>
                        <option th:each="root : ${rootCategories}" th:value="${root.id}"
                                th:text="${root.nameFor(#locale)}">Pokémon</option>
                    </select>
                    <input type="number" name="sortOrder" class="form-control" value="0"
                           th:title="#{admin.categories.sort}">
                    <button class="btn btn-accent" type="submit" th:text="#{admin.categories.add}">Lägg till</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
