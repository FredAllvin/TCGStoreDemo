<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="#{admin.nav.password} + ' – Admin'">Lösenord</title>
</head>
<body>
<main style="max-width: 420px;">
    <h1 class="h4 mb-3" th:text="#{admin.password.title}">Byt lösenord</h1>

    <form th:action="@{/admin/password}" method="post" class="card border-0 shadow-sm p-3">
        <div class="mb-3">
            <label class="form-label" for="currentPassword" th:text="#{admin.password.current}">Nuvarande lösenord</label>
            <input type="password" class="form-control" id="currentPassword" name="currentPassword" required
                   autocomplete="current-password">
        </div>
        <div class="mb-3">
            <label class="form-label" for="newPassword" th:text="#{admin.password.new}">Nytt lösenord</label>
            <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="8"
                   autocomplete="new-password">
            <div class="form-text" th:text="#{admin.password.hint}">Minst 8 tecken.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword" th:text="#{admin.password.confirm}">Upprepa nytt lösenord</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                   autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-accent" th:text="#{admin.save}">Spara</button>
    </form>
</main>
</body>
</html>
