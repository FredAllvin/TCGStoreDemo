<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${category.name} + ' – ' + ${settings.storeName}">Kategori</title>
</head>
<body>
<main class="container py-4 flex-grow-1">

    <nav aria-label="breadcrumb" th:if="${category.parent != null}">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{nav.home}">Hem</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{'/c/' + ${category.parent.slug}}" th:text="${category.parent.name}">Spel</a>
            </li>
            <li class="breadcrumb-item active" th:text="${category.name}">Kategori</li>
        </ol>
    </nav>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0" th:text="${category.parent != null ? category.parent.name + ' – ' + category.name : category.name}">Kategori</h1>

        <form method="get" class="d-flex align-items-center gap-3">
            <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" name="inStock" value="true" id="inStock"
                       th:checked="${inStock}" onchange="this.form.submit()">
                <label class="form-check-label small" for="inStock" th:text="#{category.inStockOnly}">Endast i lager</label>
            </div>
            <select class="form-select form-select-sm w-auto" name="sort" onchange="this.form.submit()"
                    th:attr="aria-label=#{category.sort}">
                <option value="newest" th:selected="${sort == 'newest'}" th:text="#{category.sort.newest}">Nyast</option>
                <option value="name" th:selected="${sort == 'name'}" th:text="#{category.sort.name}">Namn A–Ö</option>
            </select>
        </form>
    </div>

    <div class="mb-3" th:if="${!category.children.isEmpty()}">
        <a th:each="child : ${category.children}" class="btn btn-sm btn-outline-accent me-2 mb-1"
           th:href="@{'/c/' + ${child.slug}}" th:text="${child.name}">Singles</a>
    </div>

    <div th:if="${products.isEmpty()}" class="text-center text-muted py-5">
        <p class="h6" th:text="#{category.empty}">Inga produkter här ännu.</p>
    </div>

    <div class="row g-3 row-cols-2 row-cols-md-3 row-cols-lg-4" th:unless="${products.isEmpty()}">
        <div class="col" th:each="p : ${products.content}">
            <div th:replace="~{fragments/product-card :: card(${p})}"></div>
        </div>
    </div>

    <nav th:if="${products.totalPages > 1}" class="d-flex justify-content-center align-items-center gap-3 mt-4">
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${products.first} ? 'disabled'"
           th:href="@{'/c/' + ${category.slug}(inStock=${inStock}, sort=${sort}, page=${products.number - 1})}"
           th:text="#{page.prev}">Föregående</a>
        <span class="small text-muted" th:text="#{page.of(${products.number + 1}, ${products.totalPages})}">Sida 1 av 2</span>
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${products.last} ? 'disabled'"
           th:href="@{'/c/' + ${category.slug}(inStock=${inStock}, sort=${sort}, page=${products.number + 1})}"
           th:text="#{page.next}">Nästa</a>
    </nav>

</main>
</body>
</html>
