<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${settings.storeName} + ' – ' + ${settings.tagline ?: ''}">Kortbutiken</title>
</head>
<body>
<main class="flex-grow-1">

    <section class="hero text-white text-center py-5 mb-4">
        <div class="container py-3">
            <h1 class="display-5 fw-bold" th:text="${settings.storeName}">Kortbutiken</h1>
            <p class="lead opacity-75 mb-4" th:text="${settings.tagline}">Singles, sealed &amp; tillbehör</p>
            <a th:if="${!navCategories.isEmpty()}" class="btn btn-accent btn-lg px-4"
               th:href="@{'/c/' + ${navCategories[0].slug}}" th:text="#{home.shopNow}">Handla nu</a>
        </div>
    </section>

    <div class="container">
        <section class="mb-5" th:if="${!featured.isEmpty()}">
            <h2 class="h4 mb-3" th:text="#{home.featured}">Utvalda produkter</h2>
            <div class="row g-3 row-cols-2 row-cols-md-3 row-cols-lg-4">
                <div class="col" th:each="p : ${featured}">
                    <div th:replace="~{fragments/product-card :: card(${p})}"></div>
                </div>
            </div>
        </section>

        <section class="mb-5" th:if="${!recent.isEmpty()}">
            <h2 class="h4 mb-3" th:text="#{home.recent}">Nyinkommet</h2>
            <div class="row g-3 row-cols-2 row-cols-md-3 row-cols-lg-4">
                <div class="col" th:each="p : ${recent}">
                    <div th:replace="~{fragments/product-card :: card(${p})}"></div>
                </div>
            </div>
        </section>

        <section class="mb-5" th:if="${featured.isEmpty() && recent.isEmpty()}">
            <div class="text-center text-muted py-5">
                <p class="h5" th:text="#{home.empty}">Butiken fylls på…</p>
            </div>
        </section>
    </div>

</main>
</body>
</html>
