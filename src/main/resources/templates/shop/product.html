<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${product.name} + (${product.setName != null} ? ' – ' + ${product.setName} : '') + ' – ' + ${settings.storeName}">Produkt</title>
</head>
<body>
<main class="container py-4 flex-grow-1">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{nav.home}">Hem</a></li>
            <li class="breadcrumb-item" th:if="${product.category.parent != null}">
                <a th:href="@{'/c/' + ${product.category.parent.slug}}" th:text="${product.category.parent.nameFor(#locale)}">Spel</a>
            </li>
            <li class="breadcrumb-item">
                <a th:href="@{'/c/' + ${product.category.slug}}" th:text="${product.category.nameFor(#locale)}">Kategori</a>
            </li>
            <li class="breadcrumb-item active" th:text="${product.name}">Produkt</li>
        </ol>
    </nav>

    <div class="row g-4">
        <!-- Gallery -->
        <div class="col-md-5 col-lg-4">
            <div class="gallery-main mb-2">
                <img id="galleryMain"
                     th:if="${product.mainImagePath() != null}"
                     th:src="@{'/uploads/' + ${product.mainImagePath()}}"
                     th:alt="${product.name}">
                <div th:unless="${product.mainImagePath() != null}"
                     class="d-flex align-items-center justify-content-center h-100 text-muted"
                     th:text="#{product.noImage}">Ingen bild</div>
            </div>
            <div class="d-flex gap-2 flex-wrap" th:if="${product.images.size() > 1}">
                <img th:each="img, st : ${product.images}"
                     th:src="@{'/uploads/' + ${img.path}}"
                     th:alt="${img.alt}"
                     class="gallery-thumb"
                     th:classappend="${st.first} ? 'active'"
                     onclick="document.getElementById('galleryMain').src = this.src;
                              document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
                              this.classList.add('active');">
            </div>
        </div>

        <!-- Info -->
        <div class="col-md-7 col-lg-8">
            <h1 class="h3 mb-1" th:text="${product.name}">Kortnamn</h1>
            <p class="text-muted mb-3" th:if="${product.setName != null}">
                <span th:text="${product.setName}">Set</span>
                <span th:if="${product.cardNumber != null}" th:text="' · ' + ${product.cardNumber}">· 057/191</span>
            </p>

            <table class="table table-sm w-auto small mb-4">
                <tbody>
                <tr th:if="${product.rarity != null}">
                    <th class="pe-3 text-muted fw-normal" th:text="#{product.rarity}">Raritet</th>
                    <td th:text="${product.rarity}">Double Rare</td>
                </tr>
                <tr th:if="${product.language != null}">
                    <th class="pe-3 text-muted fw-normal" th:text="#{product.language}">Språk</th>
                    <td th:text="${product.language}">EN</td>
                </tr>
                </tbody>
            </table>

            <!-- Standard (sealed/accessory) -->
            <div th:each="v : ${product.standardVariants()}" class="card border-0 shadow-sm p-3 mb-3" style="max-width: 460px;">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <div class="h4 mb-0" th:text="${@fmt.money(v.priceMinor)}">549 kr</div>
                        <div class="small text-muted" th:if="${#locale.language == 'en' && @fmt.moneyEur(v.priceMinor) != null}"
                             th:text="${@fmt.moneyEur(v.priceMinor)}">≈ €48</div>
                    </div>
                    <span th:if="${v.inStock()}" class="badge bg-success"
                          th:text="#{product.inStockCount(${v.stockQty})}">4 st i lager</span>
                    <span th:unless="${v.inStock()}" class="badge bg-secondary" th:text="#{product.outOfStock}">Slut</span>
                </div>
                <form th:action="@{/cart/add}" method="post" class="d-flex gap-2">
                    <input type="hidden" name="variantId" th:value="${v.id}">
                    <input type="hidden" name="back" th:value="${product.slug}">
                    <input type="number" class="form-control form-control-sm" style="width: 80px"
                           name="qty" value="1" min="1" th:max="${v.stockQty}" th:disabled="${!v.inStock()}">
                    <button type="submit" class="btn btn-accent btn-sm flex-grow-1"
                            th:disabled="${!v.inStock()}" th:text="#{product.addToCart}">Lägg i varukorg</button>
                </form>
            </div>

            <!-- Raw singles -->
            <div th:if="${!product.rawVariants().isEmpty()}" class="mb-4">
                <h2 class="h6 text-uppercase text-muted" th:text="#{product.raw}">Ograderade</h2>
                <div class="table-responsive">
                    <table class="table variant-table align-middle">
                        <thead class="small text-muted">
                        <tr>
                            <th th:text="#{product.condition}">Skick</th>
                            <th th:text="#{product.price}">Pris</th>
                            <th th:text="#{product.stock}">I lager</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="v : ${product.rawVariants()}">
                            <td>
                                <span class="cond-badge" th:classappend="'cond-' + ${v.condition}"
                                      th:text="${v.condition}" th:title="#{'condition.' + ${v.condition}}">NM</span>
                                <span class="small text-muted ms-1" th:if="${v.finish != null && v.finish.name() != 'NONFOIL'}"
                                      th:text="#{'finish.' + ${v.finish}}">Foil</span>
                            </td>
                            <td>
                                <span class="fw-semibold" th:text="${@fmt.money(v.priceMinor)}">45 kr</span>
                                <div class="small text-muted" th:if="${#locale.language == 'en' && @fmt.moneyEur(v.priceMinor) != null}"
                                     th:text="${@fmt.moneyEur(v.priceMinor)}">≈ €4</div>
                            </td>
                            <td class="small" th:text="${v.inStock()} ? #{product.pieces(${v.stockQty})} : '–'">2 st</td>
                            <td class="text-end">
                                <form th:action="@{/cart/add}" method="post" class="d-flex gap-2 justify-content-end">
                                    <input type="hidden" name="variantId" th:value="${v.id}">
                                    <input type="hidden" name="back" th:value="${product.slug}">
                                    <input type="number" class="form-control form-control-sm" style="width: 70px"
                                           name="qty" value="1" min="1" th:max="${v.stockQty}"
                                           th:disabled="${!v.inStock()}" th:if="${v.stockQty > 1}">
                                    <input type="hidden" name="qty" value="1" th:unless="${v.stockQty > 1}">
                                    <button type="submit" class="btn btn-sm btn-accent text-nowrap"
                                            th:disabled="${!v.inStock()}"
                                            th:text="${v.inStock()} ? #{product.addToCart} : #{product.outOfStock}">Lägg i varukorg</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Graded -->
            <div th:if="${!product.gradedVariants().isEmpty()}" class="mb-4">
                <h2 class="h6 text-uppercase text-muted" th:text="#{product.graded}">Graderade</h2>
                <div class="table-responsive">
                    <table class="table variant-table align-middle">
                        <tbody>
                        <tr th:each="v : ${product.gradedVariants()}">
                            <td>
                                <span class="graded-badge" th:text="${v.grader} + ' ' + ${v.grade}">PSA 10</span>
                                <div class="small text-muted" th:if="${v.certNumber != null}"
                                     th:text="#{product.cert} + ' #' + ${v.certNumber}">Cert #123</div>
                            </td>
                            <td>
                                <span class="fw-semibold" th:text="${@fmt.money(v.priceMinor)}">1 895 kr</span>
                                <div class="small text-muted" th:if="${#locale.language == 'en' && @fmt.moneyEur(v.priceMinor) != null}"
                                     th:text="${@fmt.moneyEur(v.priceMinor)}">≈ €166</div>
                            </td>
                            <td class="small" th:text="${v.inStock()} ? #{product.pieces(${v.stockQty})} : '–'">1 st</td>
                            <td class="text-end">
                                <form th:action="@{/cart/add}" method="post">
                                    <input type="hidden" name="variantId" th:value="${v.id}">
                                    <input type="hidden" name="back" th:value="${product.slug}">
                                    <input type="hidden" name="qty" value="1">
                                    <button type="submit" class="btn btn-sm btn-accent text-nowrap"
                                            th:disabled="${!v.inStock()}"
                                            th:text="${v.inStock()} ? #{product.addToCart} : #{product.soldOut}">Lägg i varukorg</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:if="${product.descriptionFor(#locale) != null}" class="mt-3">
                <h2 class="h6 text-uppercase text-muted" th:text="#{product.description}">Beskrivning</h2>
                <p th:text="${product.descriptionFor(#locale)}">Beskrivning…</p>
            </div>
        </div>
    </div>

</main>
</body>
</html>
